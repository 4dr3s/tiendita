packages:
  - apps/*
  - packages/*

# pnpm 10 does not run a dependency's build scripts unless the package is listed here.
# This is an allow-list, not a deny-list: `ignoredBuiltDependencies` records a denial and
# does NOT answer pnpm's "which dependencies should be allowed to run scripts?" question.
# Getting that backwards is why the `Ignored build scripts` notice used to persist.
#
#   sharp           next/image optimization (apps/web)
#   unrs-resolver   resolver used by the Next.js ESLint config
#   @parcel/watcher optional dependency of jest-haste-map; its only consumer here is
#                   `jest --watch`
#
# Anything not listed is denied by default, so a new transitive dependency with a build
# script cannot run one silently — it shows up as an unapproved build and has to be
# decided on purpose. Approve another package with `pnpm approve-builds`.
#
# Note: the `@` must stay quoted. Unquoted, YAML reads it as a reserved indicator and the
# file stops parsing.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@parcel/watcher'
